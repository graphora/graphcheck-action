name: Action contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s tests -v

  exit-code:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        code: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Install fake CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/graphcheck-bin"
          printf '%s\n' '#!/usr/bin/env bash' 'exit "$MOCK_EXIT_CODE"' > "$RUNNER_TEMP/graphcheck-bin/graphcheck"
          chmod +x "$RUNNER_TEMP/graphcheck-bin/graphcheck"
          echo "$RUNNER_TEMP/graphcheck-bin" >> "$GITHUB_PATH"
      - name: Run Action
        id: graphcheck
        continue-on-error: true
        uses: ./
        with:
          uri: bolt://localhost:7687
          user: neo4j
          version: ''
          upload-artifacts: never
        env:
          MOCK_EXIT_CODE: ${{ matrix.code }}
      - name: Verify preserved exit code
        shell: bash
        env:
          ACTUAL: ${{ steps.graphcheck.outcome }}
          ACTUAL_CODE: ${{ steps.graphcheck.outputs.exit-code }}
          EXPECTED: ${{ matrix.code == 0 && 'success' || 'failure' }}
          EXPECTED_CODE: ${{ matrix.code }}
        run: test "$ACTUAL" = "$EXPECTED" && test "$ACTUAL_CODE" = "$EXPECTED_CODE"

  pre-run-failure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - failure: installation
            version: 0.0.0-contract-missing
            concurrency: ''
          - failure: preparation
            version: ''
            concurrency: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Trigger ${{ matrix.failure }} failure
        id: graphcheck
        continue-on-error: true
        uses: ./
        with:
          uri: bolt://localhost:7687
          user: neo4j
          version: ${{ matrix.version }}
          concurrency: ${{ matrix.concurrency }}
          upload-artifacts: never
      - name: Verify failure resolves to exit code 3
        shell: bash
        env:
          ACTUAL: ${{ steps.graphcheck.outcome }}
          ACTUAL_CODE: ${{ steps.graphcheck.outputs.exit-code }}
        run: test "$ACTUAL" = failure && test "$ACTUAL_CODE" = 3

  platform-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned CLI and invoke it
        id: graphcheck
        continue-on-error: true
        uses: ./
        with:
          uri: bolt://127.0.0.1:1
          user: neo4j
          upload-artifacts: never
        env:
          NEO4J_PASSWORD: contract-test
      - name: Verify pinned CLI installation
        shell: bash
        run: test "$(graphcheck --version)" = "graphcheck 0.3.0"
      - name: Verify platform path reaches the CLI
        shell: bash
        env:
          ACTUAL: ${{ steps.graphcheck.outcome }}
          ACTUAL_CODE: ${{ steps.graphcheck.outputs.exit-code }}
        # An install failure also resolves to failure/3, so the outcome alone cannot
        # prove the CLI ran on this platform. The pinned CLI landing on GITHUB_PATH
        # and reporting its exact version is the proof that the install worked and
        # the failure/3 came from the CLI's own connection preflight.
        run: |
          test "$ACTUAL" = failure
          test "$ACTUAL_CODE" = 3
          installed="$(graphcheck --version)"
          echo "installed: $installed"
          test "$installed" = "graphcheck 0.3.0"  # keep in lockstep with action.yml's version default

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Install artifact-producing fake CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/graphcheck-bin"
          printf '%s\n' '#!/usr/bin/env bash' 'mkdir -p .graphcheck/runs/latest' 'touch .graphcheck/runs/latest/results.json .graphcheck/runs/latest/summary.json .graphcheck/runs/latest/report.html' > "$RUNNER_TEMP/graphcheck-bin/graphcheck"
          chmod +x "$RUNNER_TEMP/graphcheck-bin/graphcheck"
          echo "$RUNNER_TEMP/graphcheck-bin" >> "$GITHUB_PATH"
      - name: First Action invocation
        uses: ./
        with:
          artifact-name: graphcheck-results-first
          uri: bolt://localhost:7687
          user: neo4j
          version: ''
      - name: Second Action invocation
        uses: ./
        with:
          artifact-name: graphcheck-results-second
          uri: bolt://localhost:7687
          user: neo4j
          version: ''
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: graphcheck-results-first
          path: downloaded/first
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: graphcheck-results-second
          path: downloaded/second
      - name: Verify both artifact triples
        shell: bash
        run: |
          test -f downloaded/first/results.json
          test -f downloaded/first/summary.json
          test -f downloaded/first/report.html
          test -f downloaded/second/results.json
          test -f downloaded/second/summary.json
          test -f downloaded/second/report.html

  contract:
    if: always()
    needs: [metadata, exit-code, pre-run-failure, platform-install, artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Require every contract job
        shell: bash
        env:
          ARTIFACTS: ${{ needs.artifacts.result }}
          EXIT_CODE: ${{ needs.exit-code.result }}
          METADATA: ${{ needs.metadata.result }}
          PLATFORM_INSTALL: ${{ needs.platform-install.result }}
          PRE_RUN_FAILURE: ${{ needs.pre-run-failure.result }}
        run: test "$ARTIFACTS" = success && test "$EXIT_CODE" = success && test "$METADATA" = success && test "$PLATFORM_INSTALL" = success && test "$PRE_RUN_FAILURE" = success
