name: Action contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s tests -v

  exit-code:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        code: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Install fake CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/graphcheck-bin"
          printf '%s\n' '#!/usr/bin/env bash' 'exit "$MOCK_EXIT_CODE"' > "$RUNNER_TEMP/graphcheck-bin/graphcheck"
          chmod +x "$RUNNER_TEMP/graphcheck-bin/graphcheck"
          echo "$RUNNER_TEMP/graphcheck-bin" >> "$GITHUB_PATH"
      - name: Run Action
        id: graphcheck
        continue-on-error: true
        uses: ./
        with:
          uri: bolt://localhost:7687
          user: neo4j
          version: ''
          upload-artifacts: never
        env:
          MOCK_EXIT_CODE: ${{ matrix.code }}
      - name: Verify preserved exit code outcome
        shell: bash
        env:
          ACTUAL: ${{ steps.graphcheck.outcome }}
          ACTUAL_CODE: ${{ steps.graphcheck.outputs.exit-code }}
          EXPECTED: ${{ matrix.code == 0 && 'success' || 'failure' }}
          EXPECTED_CODE: ${{ matrix.code }}
        run: test "$ACTUAL" = "$EXPECTED" && test "$ACTUAL_CODE" = "$EXPECTED_CODE"

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Install artifact-producing fake CLI
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/graphcheck-bin"
          printf '%s\n' '#!/usr/bin/env bash' 'mkdir -p .graphcheck/runs/latest' 'touch .graphcheck/runs/latest/results.json .graphcheck/runs/latest/summary.json .graphcheck/runs/latest/report.html' > "$RUNNER_TEMP/graphcheck-bin/graphcheck"
          chmod +x "$RUNNER_TEMP/graphcheck-bin/graphcheck"
          echo "$RUNNER_TEMP/graphcheck-bin" >> "$GITHUB_PATH"
      - uses: ./
        with:
          uri: bolt://localhost:7687
          user: neo4j
          version: ''
      - uses: actions/download-artifact@v4
        with:
          name: graphcheck-results
          path: downloaded
      - run: test -f downloaded/results.json && test -f downloaded/summary.json && test -f downloaded/report.html
